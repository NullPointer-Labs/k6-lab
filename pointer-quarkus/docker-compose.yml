services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres_quarkus_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    restart: unless-stopped

  pointer-quarkus:
    build: .
    container_name: pointer_quarkus_api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://${DB_USER}:${DB_PORT}/${DB_NAME}
      - QUARKUS_DATASOURCE_USERNAME=${DB_USER}
      - QUARKUS_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION=update

volumes:
  pg_data: